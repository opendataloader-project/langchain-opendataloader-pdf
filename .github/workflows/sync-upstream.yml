name: Sync upstream release

on:
  repository_dispatch:
    types: [upstream-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'opendataloader-pdf version (e.g. 2.3.0)'
        required: true

permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  # =================================================================
  # Job 1: Generate updated code
  # =================================================================
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      breaking: ${{ steps.breaking.outputs.detected }}
      branch: ${{ steps.branch.outputs.name }}

    env:
      VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}

    steps:
      - name: Validate version format
        run: |
          if ! echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: '${VERSION}'. Expected semver (e.g., 2.3.0)"
            exit 1
          fi

      - name: Checkout langchain-opendataloader-pdf
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout opendataloader-pdf (sparse)
        uses: actions/checkout@v6
        with:
          repository: opendataloader-project/opendataloader-pdf
          ref: v${{ env.VERSION }}
          path: upstream
          sparse-checkout: |
            options.json
            scripts/generate-langchain.mjs
            scripts/langchain-sync-config.json
            scripts/utils.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Save current params (for breaking change detection)
        run: |
          grep -E "^\s+(self\.\w+ =|# --- )" langchain_opendataloader_pdf/document_loaders.py \
            | grep "self\." | sed 's/.*self\.\([a-z_]*\).*/\1/' | sort > /tmp/params-before.txt

      - name: Run langchain code generator
        run: |
          mkdir -p .sync-report
          node upstream/scripts/generate-langchain.mjs \
            --options upstream/options.json \
            --config upstream/scripts/langchain-sync-config.json \
            --target langchain_opendataloader_pdf/document_loaders.py \
            --readme README.md \
            --version "${VERSION}" \
            --pr-body .sync-report/pr-body.md

      - name: Update pyproject.toml dependency
        run: |
          # Defense-in-depth: semver validation above blocks metacharacters,
          # but escape anyway in case the validation regex is ever relaxed.
          ESCAPED_VER=$(printf '%s\n' "${VERSION}" | sed 's/[&/\]/\\&/g')
          sed -i "s/\"opendataloader-pdf>=.*\"/\"opendataloader-pdf>=${ESCAPED_VER}\"/" pyproject.toml

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --stat
          fi

      - name: Detect breaking changes
        id: breaking
        if: steps.changes.outputs.changed == 'true'
        run: |
          grep -E "^\s+(self\.\w+ =|# --- )" langchain_opendataloader_pdf/document_loaders.py \
            | grep "self\." | sed 's/.*self\.\([a-z_]*\).*/\1/' | sort > /tmp/params-after.txt
          REMOVED=$(comm -23 /tmp/params-before.txt /tmp/params-after.txt)
          if [ -n "$REMOVED" ]; then
            echo "detected=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Breaking: removed params: $REMOVED"
            echo "$REMOVED" > .sync-report/breaking-changes.txt
          else
            echo "detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch and push
        if: steps.changes.outputs.changed == 'true'
        id: branch
        run: |
          BRANCH="sync/v${VERSION}"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add langchain_opendataloader_pdf/document_loaders.py pyproject.toml README.md
          git add .sync-report/ || true
          git commit -m "sync: update to opendataloader-pdf v${VERSION}"
          git push origin "$BRANCH" --force-with-lease

  # =================================================================
  # Job 2: Create PR, start the tests on the sync branch, notify
  # =================================================================
  # The tests do not run in this workflow. It runs in the context of the
  # default branch (repository_dispatch, workflow_dispatch), so code of the
  # sync branch that ran here could write to the Actions cache that every
  # workflow on main restores (CodeQL actions/cache-poisoning/poisonable-step).
  # The Test workflow runs on the sync branch instead (workflow_dispatch): its
  # cache is scoped to that branch. Its checks are not in the checks list of
  # the pull request, so this job waits for the run, comments its result on
  # the pull request, and makes the pull request a draft if a test fails.
  create-pr:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      actions: write

    env:
      VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ needs.generate.outputs.branch }}
      BREAKING: ${{ needs.generate.outputs.breaking }}

    steps:
      # No `cache: pip`: a cache saved here is scoped to the default branch.
      # These steps run before the checkout, so no code of the sync branch runs.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # The tests install opendataloader-pdf>=VERSION, so start them only when
      # PyPI has that version.
      - name: Wait for PyPI availability
        run: |
          for i in $(seq 1 20); do
            if pip install --dry-run "opendataloader-pdf==${VERSION}" 2>/dev/null; then
              echo "Version ${VERSION} available on PyPI"
              exit 0
            fi
            echo "Attempt $i/20: waiting 30s..."
            sleep 30
          done
          echo "::error::PyPI version ${VERSION} not available after 10 minutes"
          exit 1

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.generate.outputs.branch }}
          fetch-depth: 2

      - name: Build PR body
        run: |
          {
            echo "## Sync with opendataloader-pdf v${VERSION}"
            echo ""
            echo "The Test workflow runs on this branch after this pull request is created. A comment on this pull request gives its result."
            echo ""
            echo "Auto-generated from [opendataloader-pdf v${VERSION}](https://github.com/opendataloader-project/opendataloader-pdf/releases/tag/v${VERSION})."
          } > /tmp/pr-body.md

          if [ "$BREAKING" == "true" ]; then
            echo "" >> /tmp/pr-body.md
            echo "### ⚠️ Breaking Changes Detected" >> /tmp/pr-body.md
            cat .sync-report/breaking-changes.txt >> /tmp/pr-body.md 2>/dev/null || echo "See diff for details" >> /tmp/pr-body.md
          fi

          {
            echo ""
            echo "### Changes"
            echo '```'
            git diff main...HEAD --stat
            echo '```'
          } >> /tmp/pr-body.md

      - name: Create pull request
        run: |
          LABELS="sync,automated"
          [ "$BREAKING" == "true" ] && LABELS="$LABELS,breaking-change"

          gh pr create \
            --title "sync: update to opendataloader-pdf v${VERSION}" \
            --body-file /tmp/pr-body.md \
            --base main \
            --label "${LABELS}"

      - name: Run the Test workflow on the sync branch
        id: tests
        run: |
          SHA=$(git rev-parse HEAD)
          list_runs() {
            gh run list --workflow test.yml --branch "$BRANCH" --event workflow_dispatch \
              --commit "$SHA" --limit 20 --json databaseId --jq '.[].databaseId'
          }
          # Runs of earlier dispatches on this commit, for example of a re-run.
          OLD=" $(list_runs | tr '\n' ' ') "
          gh workflow run test.yml --ref "$BRANCH"
          # The run of the dispatch can take a few seconds to appear.
          RUN_ID=""
          for _ in $(seq 1 24); do
            for id in $(list_runs); do
              case "$OLD" in *" $id "*) ;; *) RUN_ID=$id; break ;; esac
            done
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::The Test workflow did not start on ${BRANCH}"
            exit 1
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          if gh run watch "$RUN_ID" --exit-status > /dev/null; then
            RESULT="✅ All tests passed"
          else
            RESULT="❌ Tests failed"
            gh pr ready "$BRANCH" --undo
          fi
          echo "result=${RESULT}" >> "$GITHUB_OUTPUT"
          gh pr comment "$BRANCH" --body "${RESULT}: [Test workflow on this branch](${RUN_URL})"

      - name: Notify Slack
        if: always() && env.SLACK_URL != ''
        env:
          SLACK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "langchain sync v${{ env.VERSION }}: ${{ steps.tests.outputs.result || format('job {0}', job.status) }}\n${{ needs.generate.outputs.breaking == 'true' && '⚠️ Breaking changes detected!' || '' }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
