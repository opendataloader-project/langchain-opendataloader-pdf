name: Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e . pytest pytest-socket

      - name: Run unit tests
        run: pytest tests/test_document_loaders.py -v --disable-socket --allow-unix-socket

  min-dep-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install minimum dependency versions
        run: |
          # The lowest opendataloader-pdf that pyproject.toml allows; a sync raises it.
          ODL_MIN=$(python -c 'import re, tomllib; deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]; print(next(re.match(r"opendataloader-pdf>=([0-9.]+)", d).group(1) for d in deps if d.startswith("opendataloader-pdf>=")))')
          pip install "langchain-core==1.0.0" "opendataloader-pdf==${ODL_MIN}" pytest pytest-socket
          pip install -e . --no-deps

      - name: Run unit tests with minimum deps
        run: pytest tests/test_document_loaders.py -v --disable-socket --allow-unix-socket
